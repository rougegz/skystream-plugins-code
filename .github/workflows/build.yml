name: Build & Deploy

# Source: rougegz/skystream-plugins-code -> Dist: rougegz/SkystreamPlugins
# Users install via: https://raw.githubusercontent.com/rougegz/SkystreamPlugins/main/repo.json
#
# Full sync semantics:
#   - new/changed plugins  -> written to dist/
#   - deleted/renamed plugins -> their .sky REMOVED from dist/
#   - identical bundles    -> left untouched (zips embed timestamps, so this
#                             prevents churn commits on comment-only pushes)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dist
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SkyStream CLI
        run: npm install -g skystream-cli@latest

      - name: Build Plugins
        run: |
          skystream deploy -u "https://raw.githubusercontent.com/rougegz/SkystreamPlugins/main"
          echo "## Built plugins" >> "$GITHUB_STEP_SUMMARY"
          ls dist/*.sky | xargs -n1 basename >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout dist repo
        uses: actions/checkout@v4
        with:
          repository: rougegz/SkystreamPlugins
          ref: main
          path: deploy-repo
          token: ${{ secrets.REPO_PUSH_TOKEN }}

      - name: Sync dist (add/update/delete)
        run: |
          python3 - <<'EOF'
          import zipfile, pathlib, hashlib, shutil

          def inner_hash(p):
              p = pathlib.Path(p)
              if not p.exists():
                  return None
              try:
                  z = zipfile.ZipFile(p)
                  h = hashlib.sha256()
                  for n in sorted(z.namelist()):
                      h.update(n.encode())
                      h.update(z.read(n))
                  return h.hexdigest()
              except Exception:
                  return None

          src = pathlib.Path("dist")
          dst = pathlib.Path("deploy-repo/dist")
          dst.mkdir(parents=True, exist_ok=True)

          kept = changed = removed = 0
          built = set()
          for new in sorted(src.glob("*.sky")):
              built.add(new.name)
              old = dst / new.name
              if inner_hash(new) == inner_hash(old):
                  kept += 1
              else:
                  shutil.copyfile(new, old)
                  changed += 1
          for old in sorted(dst.glob("*.sky")):
              if old.name not in built:
                  old.unlink()
                  removed += 1

          # repo index files always reflect the latest build
          for f in ("repo.json",):
              if (src.parent / f).exists() or pathlib.Path(f).exists():
                  shutil.copyfile(f, f"deploy-repo/{f}")
          if (src / "plugins.json").exists():
              shutil.copyfile(src / "plugins.json", dst / "plugins.json")

          print(f"unchanged: {kept}, updated: {changed}, removed: {removed}")
          EOF

      - name: Commit & Push
        run: |
          cd deploy-repo
          git config user.name "rougegz"
          git config user.email "rougegz@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from ${GITHUB_SHA} [skip ci]"
            git push origin main
          fi
